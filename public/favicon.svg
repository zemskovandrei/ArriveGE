<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ArriveGE">
  <defs>
    <linearGradient id="sky" x1="12" y1="4" x2="52" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#134849"/>
      <stop offset=".55" stop-color="#0a2829"/>
      <stop offset="1" stop-color="#07191a"/>
    </linearGradient>
    <linearGradient id="peak" x1="20" y1="14" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#cfc7b8"/>
    </linearGradient>
    <linearGradient id="pin" x1="26" y1="26" x2="40" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8924a"/>
      <stop offset="1" stop-color="#c46a2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="34" r="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e07a35" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e07a35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#sky)"/>
  <circle cx="32" cy="34" r="18" fill="url(#glow)"/>

  <!-- Soft ridge -->
  <path
    d="M8 46 C16 36 22 34 28 38 C33 30 38 24 44 22 C50 28 54 36 58 46 Z"
    fill="#0f3d3e"
    opacity=".9"
  />

  <!-- Main peak -->
  <path
    d="M18 46 L32 16 L46 46 Z"
    fill="url(#peak)"
  />
  <path
    d="M32 16 L46 46 L39.5 46 L32 28 Z"
    fill="#9f9586"
    opacity=".35"
  />
  <!-- Snow cap -->
  <path
    d="M26.8 27.2 L32 16 L37.2 27.2 C34.8 26.2 33.1 26.2 32 26.2 C30.9 26.2 29.2 26.2 26.8 27.2 Z"
    fill="#fff8ef"
  />

  <!-- Arrival pin -->
  <path
    d="M32 28.5c-4.1 0-7.4 3.2-7.4 7.1 0 5.1 7.4 13.1 7.4 13.1s7.4-8 7.4-13.1c0-3.9-3.3-7.1-7.4-7.1z"
    fill="url(#pin)"
  />
  <circle cx="32" cy="35.4" r="2.8" fill="#fff8ef"/>
</svg>
